<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabla del 3 - Sistema Interfaz</title>
    <!-- Fuente con estilo tecnológico y de código -->
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="multiplicar.css">
    <script src="multiplicar.js"></script>
</head>
<body>

    <div class="contenedor">
        <!-- Caja de texto para ingresar el número -->
        <input type="number" id="numero-tabla" class="input-tecnologico" placeholder="Ingresa un número" value="3">
        <!-- Botón superior con estilo de consola -->
        <button class="btn-probar" onclick="generarTablas()">PROBAR_SISTEMA</button>
        
        <h1>>_ TABLA_DEL_3</h1>
        
        <!-- Tabla de datos -->
        <table class="tabla-multiplicar">
            <thead>
                <tr>
                    <th>Operación</th>
                    <th>Resultado</th>
                </tr>
            </thead>
            <tbody id="tablas">
                <tr><td class="fila">3 x 1</td><td>3</td></tr>
                <tr><td class="fila">3 x 2</td><td>6</td></tr>
                <tr><td class="fila">3 x 3</td><td>9</td></tr>
                <tr><td class="fila">3 x 4</td><td>12</td></tr>
                <tr><td class="fila">3 x 5</td><td>15</td></tr>
                <tr><td class="fila">3 x 6</td><td>18</td></tr>
                <tr><td class="fila">3 x 7</td><td>21</td></tr>
                <tr><td class="fila">3 x 8</td><td>24</td></tr>
                <tr><td class="fila">3 x 9</td><td>27</td></tr>
                <tr><td class="fila">3 x 10</td><td>30</td></tr>
                <tr><td class="fila">3 x 11</td><td>33</td></tr>
                <tr><td class="fila">3 x 12</td><td>36</td></tr>
            </tbody>
        </table>

        <!-- Pie de página / Firma -->
        <div class="pie-pagina">
            >_ Creado por: CRISTIAN DAHUA | l025
            <span class="cursor-parpadeante">_</span>
        </div>
    <!-- CONTENEDOR PARA LA IMAGEN DEL CIERVO -->
        <div class="contenedor-logo">
            <img src="ciervo.jpg" alt="Logo Ciervo">
        </div>
    </div>

</body>
</html>
